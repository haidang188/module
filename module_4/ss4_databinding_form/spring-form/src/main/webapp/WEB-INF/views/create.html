<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreateEmployee</title>
</head>
<body>
<form th:action="@{/employees/save}" th:object="${employee}" method="post" novalidate="novalidate">
  <div>
    <label for="id">ID: </label>
    <input type="text" id="id" name="id" th:field="*{id}">
  </div>
  <div>
    <label for="name">Name: </label>
    <input type="text" id="name" name="name" th:field="*{name}">
  </div>
  <div>
    <label for="contactNumber">Contact Number</label>
    <input type="text" id="contactNumber" name="contactNumber" th:field="*{contactNumber}">
  </div>
  <button type="submit" >Save</button>
</form>
</body>
</html>
