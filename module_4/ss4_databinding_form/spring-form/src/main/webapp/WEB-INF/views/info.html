<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Info</title>
</head>
<body>
<h2>Employee Infomation</h2>
<p>
  ID: <span th:text="${employee.id}"></span>
</p>

<p>
  Name: <span th:text="${employee.name}"></span>
</p>

<p>
  ContactNumber: <span th:text="${employee.contactNumber}"></span>
</p>
</body>
</html>
