<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>User Registration</h2>

    <form th:action="@{/register}"
          th:object="${user}"
          method="post">

        <div class="mb-3">

            <label>First Name</label>

            <input type="text"
                   class="form-control"
                   th:field="*{firstName}">

            <small class="text-danger"
                   th:errors="*{firstName}">
            </small>
        </div>

        <div class="mb-3">

            <label>Last Name</label>

            <input type="text"
                   class="form-control"
                   th:field="*{lastName}">

            <small class="text-danger"
                   th:errors="*{lastName}">
            </small>

        </div>

        <div class="mb-3">

            <label>Phone Number</label>

            <input type="text"
                   class="form-control"
                   th:field="*{phoneNumber}">

            <small class="text-danger"
                   th:errors="*{phoneNumber}">
            </small>

        </div>

        <div class="mb-3">

            <label>Age</label>

            <input type="number"
                   class="form-control"
                   th:field="*{age}">

            <small class="text-danger"
                   th:errors="*{age}">
            </small>

        </div>

        <div class="mb-3">

            <label>Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}">

            <small class="text-danger"
                   th:errors="*{email}">
            </small>

        </div>

        <button class="btn btn-primary">
            Register
        </button>

    </form>

</div>

</body>
</html>
