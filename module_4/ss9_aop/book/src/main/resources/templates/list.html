<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h2>Library</h2>

<table border="1">

  <tr>
    <th>ID</th>
    <th>Title</th>
    <th>Quantity</th>
    <th>Action</th>
  </tr>

  <tr th:each="book : ${books}">
    <td th:text="${book.id}"></td>
    <td th:text="${book.title}"></td>
    <td th:text="${book.quantity}"></td>

    <td>
      <a th:href="@{/borrow/{id}(id=${book.id})}">
        Borrow
      </a>
    </td>
  </tr>

</table>

<br>

<a href="/return">
  Return Book
</a>

</body>
</html>
