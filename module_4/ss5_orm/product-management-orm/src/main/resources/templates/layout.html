<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <title th:text="${title}"></title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .container {
      width: 90%;
      margin: 20px auto;
    }

    header {
      background-color: #343a40;
      color: white;
      padding: 15px;
      text-align: center;
    }

    footer {
      background-color: #343a40;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }

    h1, h2 {
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    table, th, td {
      border: 1px solid #ddd;
    }

    th {
      background-color: #f8f9fa;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      padding: 8px 15px;
      text-decoration: none;
      border-radius: 4px;
      color: white;
      border: none;
      cursor: pointer;
    }

    .btn-add {
      background-color: #28a745;
    }

    .btn-edit {
      background-color: #007bff;
    }

    .btn-delete {
      background-color: #dc3545;
    }

    .btn-back {
      background-color: #6c757d;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 8px;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header th:fragment="header">
  <h1>Product Management System</h1>
</header>

<footer th:fragment="footer">
  <p>© 2026 Product Management ORM</p>
</footer>

</body>
</html>
