<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Edit Product')"></head>

<body>

<div th:replace="layout :: header"></div>

<div class="container">

  <h2>Edit Product</h2>

  <form th:action="@{/products/update}"
        th:object="${product}"
        method="post">

    <input type="hidden"
           th:field="*{id}">

    <div class="form-group">
      <label>Name</label>
      <input type="text"
             th:field="*{name}">
    </div>

    <div class="form-group">
      <label>Price</label>
      <input type="number"
             th:field="*{price}">
    </div>

    <div class="form-group">
      <label>Stock</label>
      <input type="number"
             th:field="*{stock}">
    </div>

    <button type="submit" class="btn btn-edit">
      Update
    </button>

    <a th:href="@{/products}"
       class="btn btn-back">
      Back
    </a>

  </form>

</div>

<div th:replace="layout :: footer"></div>

</body>
</html>
