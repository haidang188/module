
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Delete Customer')"></head>

<body>

<div th:replace="layout :: navbar"></div>

<div class="container mt-4 page-content">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card border-danger">

                <div class="card-header bg-danger text-white">

                    <h4 class="mb-0">
                        Confirm Delete Customer
                    </h4>

                </div>

                <div class="card-body">

                    <div class="alert alert-warning">

                        <i class="fas fa-exclamation-triangle"></i>
                        Are you sure you want to delete this customer?

                    </div>

                    <form th:action="@{/customers/delete}"
                          th:object="${customer}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   readonly>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Address
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{address}"
                                   readonly>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/customers}"
                               class="btn btn-secondary">

                                <i class="fas fa-arrow-left"></i>
                                Cancel

                            </a>

                            <button type="submit"
                                    class="btn btn-danger">

                                <i class="fas fa-trash"></i>
                                Delete Customer

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="layout :: footer"></div>

</body>
</html>
