<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${title}">Customer Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:#f8f9fa;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        .page-content{
            flex:1;
        }

        .navbar-brand{
            font-weight:700;
        }

        .card{
            border:none;
            border-radius:12px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .table{
            margin-bottom:0;
        }

        .table thead{
            background:#0d6efd;
            color:white;
        }

        .btn-action{
            width:40px;
        }

        footer{
            margin-top:30px;
            background:#212529;
            color:white;
            padding:15px;
            text-align:center;
        }

        .page-title{
            font-weight:700;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary"
     th:fragment="navbar">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/customers}">
            <i class="fas fa-users"></i>
            Customer Manager
        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/customers}">
                        Customer List
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/customers/create}">
                        Add Customer
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<footer th:fragment="footer">

    © 2026 Customer Management System |
    Spring Boot + Thymeleaf + JPA

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
