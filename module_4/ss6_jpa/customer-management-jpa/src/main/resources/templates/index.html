
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Customer List')"></head>

<body>

<div th:replace="layout :: navbar"></div>

<div class="container mt-4 page-content">

    <div class="card">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="page-title mb-0">
                    Customer Management
                </h2>

                <a th:href="@{/customers/create}"
                   class="btn btn-primary">

                    <i class="fas fa-plus"></i>
                    Add Customer

                </a>

            </div>

            <div th:if="${success}"
                 class="alert alert-success">

                <span th:text="${success}"></span>

            </div>

            <div th:if="${errorMessage}"
                 class="alert alert-danger">

                <span th:text="${errorMessage}"></span>

            </div>

            <table class="table table-hover table-bordered align-middle">

                <thead>

                <tr>

                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th width="180">Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="customer, status : ${customers}">

                    <td th:text="${status.count}"></td>

                    <td th:text="${customer.name}"></td>

                    <td th:text="${customer.email}"></td>

                    <td th:text="${customer.address}"></td>

                    <td>

                        <a th:href="@{/customers/{id}/view(id=${customer.id})}"
                           class="btn btn-info btn-sm">

                            <i class="fas fa-eye"></i>

                        </a>

                        <a th:href="@{/customers/{id}/edit(id=${customer.id})}"
                           class="btn btn-warning btn-sm">

                            <i class="fas fa-edit"></i>

                        </a>

                        <a th:href="@{/customers/{id}/delete(id=${customer.id})}"
                           class="btn btn-danger btn-sm">

                            <i class="fas fa-trash"></i>

                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(customers)}">

                    <td colspan="5"
                        class="text-center text-muted">

                        No customer found

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<div th:replace="layout :: footer"></div>

</body>
</html>
