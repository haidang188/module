
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Update Customer')"></head>

<body>

<div th:replace="layout :: navbar"></div>

<div class="container mt-4 page-content">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card">

                <div class="card-header bg-warning">

                    <h4 class="mb-0">
                        Update Customer
                    </h4>

                </div>

                <div class="card-body">

                    <form th:action="@{/customers/update}"
                          th:object="${customer}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label for="name"
                                   class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control">

                        </div>

                        <div class="mb-4">

                            <label for="address"
                                   class="form-label">
                                Address
                            </label>

                            <input type="text"
                                   id="address"
                                   th:field="*{address}"
                                   class="form-control">

                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/customers}"
                               class="btn btn-secondary">

                                <i class="fas fa-arrow-left"></i>
                                Back

                            </a>

                            <button type="submit"
                                    class="btn btn-warning">

                                <i class="fas fa-edit"></i>
                                Update Customer

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<div th:replace="layout :: footer"></div>

</body>
</html>
